<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PetKarnem Onboarding Test</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <section class="slide active" data-index="0">
    <img src="screen-1.jpg" alt="">
    <button class="skip" type="button">Atla</button>
    <div class="dots">
      <button class="dot active" data-go="0"></button>
      <button class="dot" data-go="1"></button>
      <button class="dot" data-go="2"></button>
    </div>
  </section>

  <section class="slide" data-index="1">
    <img src="screen-2.jpg" alt="">
    <button class="skip" type="button">Atla</button>
    <div class="dots">
      <button class="dot" data-go="0"></button>
      <button class="dot active" data-go="1"></button>
      <button class="dot" data-go="2"></button>
    </div>
  </section>

  <section class="slide" data-index="2">
    <img src="screen-3.jpg" alt="">
    <button class="skip" type="button">Atla</button>
    <button id="addFriend" class="addFriend" type="button">＋ Dostunu Ekle</button>
    <div class="dots">
      <button class="dot" data-go="0"></button>
      <button class="dot" data-go="1"></button>
      <button class="dot active" data-go="2"></button>
    </div>
  </section>

  <div id="done" class="done">
    <div>
      <h1>Onboarding tamamlandı 💚</h1>
      <p>Bu yalnızca giriş ekranı testidir. Buradan sonra v2.58 uygulaması açılacak.</p>
      <button id="restart">Tekrar Göster</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
