name: Create Apple Distribution P12

on:
  workflow_dispatch:

jobs:
  create-p12:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest CSR signing files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow csr.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "Using CSR run: $RUN_ID"

          gh run download "$RUN_ID" \
            --name PetKarnem-Apple-Signing-Files \
            --dir signing-files

      - name: Create P12
        env:
          CERT_KEY_PASSWORD: ${{ secrets.CERT_KEY_PASSWORD }}
        run: |
          openssl pkcs12 -export \
            -inkey signing-files/distribution.key \
            -passin env:CERT_KEY_PASSWORD \
            -in "distribution 2.cer" \
            -out distribution.p12 \
            -passout env:CERT_KEY_PASSWORD

      - name: Upload P12
        uses: actions/upload-artifact@v4
        with:
          name: PetKarnem-Distribution-P12
          path: distribution.p12
