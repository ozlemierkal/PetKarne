name: PetKarnem iOS App Store Build

on:
  workflow_dispatch:

jobs:
  ios-app-store-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Capacitor project
        run: |
          mkdir ios-wrapper
          cd ios-wrapper

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

          mkdir www

          cp ../index.html www/
          cp ../app.js www/
          cp ../styles.css www/
          cp ../manifest.webmanifest www/
          cp ../sw.js www/ || true
          cp ../sw-notifications.js www/ || true

          find .. -maxdepth 1 \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.svg" \) -exec cp {} www/ \;

          npx cap init PetKarnem com.petkarnem.app --web-dir=www
          npx cap add ios

      - name: Download latest P12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow p12.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "Using P12 run: $RUN_ID"

          mkdir signing
          gh run download "$RUN_ID" \
            --name PetKarnem-Distribution-P12 \
            --dir signing

      - name: Install certificate
        env:
          CERT_KEY_PASSWORD: ${{ secrets.CERT_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          security import signing/distribution.p12 \
            -k build.keychain \
            -P "$CERT_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          data = os.environ["PROVISIONING_PROFILE_BASE64"]
          open("PetKarnem_App_Store.mobileprovision", "wb").write(base64.b64decode(data))
          PY

          security cms -D \
            -i PetKarnem_App_Store.mobileprovision \
            > profile.plist

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            profile.plist)

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp PetKarnem_App_Store.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Create export options
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>82TXB5XMLS</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.petkarnem.app</key>
              <string>PetKarnem App Store</string>
            </dict>
          </dict>
          </plist>
          EOF
      - name: Configure App signing
        run: |
          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios-wrapper/ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' }

          target.build_configurations.each do |config|
            config.build_settings['DEVELOPMENT_TEAM'] = '82TXB5XMLS'
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.petkarnem.app'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]'] = 'PetKarnem App Store'
          end

          project.save
          RUBY
      - name: Archive app
        run: |
          cd ios-wrapper

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/PetKarnem.xcarchive" \
           archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/PetKarnem.xcarchive" \
            -exportPath "$RUNNER_TEMP/PetKarnemExport" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PetKarnem-AppStore-IPA
          path: ${{ runner.temp }}/PetKarnemExport/*.ipa
