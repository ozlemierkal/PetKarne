<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PetKarnem Onboarding</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
  overscroll-behavior:none;
  touch-action:none;
  -webkit-text-size-adjust:100%;
}
#app{
  position:fixed;
  left:0;top:0;
  width:100vw;
  height:100svh;
  overflow:hidden;
  background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  touch-action:none;
  overscroll-behavior:none;
}
.slide{
  position:absolute;
  left:0;top:0;
  width:100vw;
  height:100svh;
  display:none;
  background:#fff;
  overflow:hidden;
  contain:layout paint size;
}
.slide.active{display:block}
.crop{
  position:absolute;
  left:0;top:0;
  width:100vw;
  height:100svh;
  background-image:url("onboarding-triptych.png");
  background-repeat:no-repeat;
  background-size:300vw 100svh;
  background-color:#fff;
  will-change:auto;
  transform:translateZ(0);
  backface-visibility:hidden;
}
.c1{background-position:0 0}
.c2{background-position:-100vw 0}
.c3{background-position:-200vw 0}
.skip{
  position:absolute;
  right:3.5%;
  top:3.2%;
  width:24%;
  height:7%;
  border:0;
  background:#fff;
  color:transparent;
  z-index:5;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:0 12px 0 0;
  touch-action:manipulation;
}

.skip::after{
  content:"Atla";
  color:#237A57;
  font-size:18px;
  font-weight:800;
}
.next{
  position:absolute;right:4.7%;bottom:calc(env(safe-area-inset-bottom) + 3.2%);
  width:18%;height:10%;border:0;background:transparent;color:transparent;z-index:5;
  touch-action:manipulation
}
.add{
  position:absolute;left:8%;right:8%;bottom:calc(env(safe-area-inset-bottom) + 10.5%);
  height:8%;border:0;background:transparent;color:transparent;z-index:5;
  touch-action:manipulation
}
.dots{
  position:absolute;left:35%;right:35%;bottom:calc(env(safe-area-inset-bottom) + 4%);
  height:5%;z-index:4;display:flex;justify-content:center;gap:8px;align-items:center
}
.dots button{
  width:36px;height:36px;border:0;background:transparent;border-radius:50%;
  touch-action:manipulation
}
</style>
</head>
<body>
<div id="app">
  <section class="slide active">
    <div class="crop c1"></div>
    <button class="skip" aria-label="Atla">Atla</button>
    <button class="next" aria-label="İleri">İleri</button>
    <div class="dots">
      <button data-go="0"></button><button data-go="1"></button><button data-go="2"></button>
    </div>
  </section>

  <section class="slide">
    <div class="crop c2"></div>
    <button class="skip" aria-label="Atla">Atla</button>
    <button class="next" aria-label="İleri">İleri</button>
    <div class="dots">
      <button data-go="0"></button><button data-go="1"></button><button data-go="2"></button>
    </div>
  </section>

  <section class="slide">
    <div class="crop c3"></div>
    <button class="skip" aria-label="Atla">Atla</button>
    <button class="add" aria-label="Dostunu Ekle">Dostunu Ekle</button>
    <div class="dots">
      <button data-go="0"></button><button data-go="1"></button><button data-go="2"></button>
    </div>
  </section>
</div>

<script>
(function(){
  const pages=[...document.querySelectorAll('.slide')];
  let index=0,sx=0,sy=0;

  function show(i){
    index=Math.max(0,Math.min(2,i));
    pages.forEach((p,n)=>p.classList.toggle('active',n===index));
  }

  function send(type){
    parent.postMessage({source:'petkarnem-onboarding',type:type}, location.origin);
  }

  document.querySelectorAll('.skip').forEach(b=>b.addEventListener('click',()=>send('skip')));
  document.querySelectorAll('.next').forEach(b=>b.addEventListener('click',()=>show(index+1)));
  document.querySelector('.add').addEventListener('click',()=>send('addFriend'));
  document.querySelectorAll('.dots button').forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.go))));

  document.getElementById('app').addEventListener('touchstart',e=>{
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;
  },{passive:true});

  document.getElementById('app').addEventListener('touchmove',e=>{
    e.preventDefault();
  },{passive:false});

  document.getElementById('app').addEventListener('touchend',e=>{
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){
      dx<0 ? show(index+1) : show(index-1);
    }
  },{passive:true});

  show(0);
})();
</script>
</body>
</html>
